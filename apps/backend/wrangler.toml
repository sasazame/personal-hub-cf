name = "personal-hub-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

# Default database binding for local development
[[d1_databases]]
binding = "DB"
database_name = "personal-hub-local"
database_id = "local"

# Default KV namespace for rate limiting (local)
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "rate-limiter-local"

# Development environment
[env.development]
name = "personal-hub-backend-dev"

[env.development.vars]
ENVIRONMENT = "development"
JWT_SECRET = "test-jwt-secret-for-development-only"
OAUTH_GITHUB_CLIENT_ID = "YOUR_GITHUB_CLIENT_ID"
OAUTH_GITHUB_CLIENT_SECRET = "YOUR_GITHUB_CLIENT_SECRET"
OAUTH_GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID"
OAUTH_GOOGLE_CLIENT_SECRET = "YOUR_GOOGLE_CLIENT_SECRET"

[[env.development.d1_databases]]
binding = "DB"
database_name = "personal-hub"
database_id = "c7420c0c-e416-4577-a543-f6b44de51979"

[[env.development.kv_namespaces]]
binding = "RATE_LIMITER"
id = "f441d11a5542459e865cecaaae376f02"

# Production environment
[env.production]
name = "personal-hub-backend-prod"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://your-production-domain.com"
JWT_SECRET = "PLACEHOLDER_PRODUCTION_JWT_SECRET"
OAUTH_GITHUB_CLIENT_ID = "PLACEHOLDER_GITHUB_CLIENT_ID"
OAUTH_GITHUB_CLIENT_SECRET = "PLACEHOLDER_GITHUB_CLIENT_SECRET"
OAUTH_GOOGLE_CLIENT_ID = "PLACEHOLDER_GOOGLE_CLIENT_ID"
OAUTH_GOOGLE_CLIENT_SECRET = "PLACEHOLDER_GOOGLE_CLIENT_SECRET"

[[env.production.d1_databases]]
binding = "DB"
database_name = "personal-hub-prod"
database_id = "7b37b6d9-659a-4adc-a396-fa339c12c597"

[[env.production.kv_namespaces]]
binding = "RATE_LIMITER"
id = "c1c925b1bbc2424a84fcdd8d5afc8003"

# Default vars (used in development)
[vars]
JWT_SECRET = "test-jwt-secret-for-development-only"
OAUTH_GITHUB_CLIENT_ID = "YOUR_GITHUB_CLIENT_ID"
OAUTH_GITHUB_CLIENT_SECRET = "YOUR_GITHUB_CLIENT_SECRET"
OAUTH_GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID"
OAUTH_GOOGLE_CLIENT_SECRET = "YOUR_GOOGLE_CLIENT_SECRET"