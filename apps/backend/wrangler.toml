name = "personal-hub-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

# Default database binding for local development
[[d1_databases]]
binding = "DB"
database_name = "personal-hub-local"
database_id = "local"

# Default KV namespace for rate limiting (local)
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "rate-limiter-local"

# Development environment
[env.development]
name = "personal-hub-backend-dev"
vars = { ENVIRONMENT = "development" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "personal-hub"
database_id = "c7420c0c-e416-4577-a543-f6b44de51979"

[[env.development.kv_namespaces]]
binding = "RATE_LIMITER"
id = "rate-limiter-dev"

# Production environment
[env.production]
name = "personal-hub-backend-prod"
vars = { ENVIRONMENT = "production", ALLOWED_ORIGINS = "https://your-production-domain.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "personal-hub-prod"
database_id = "7b37b6d9-659a-4adc-a396-fa339c12c597"

[[env.production.kv_namespaces]]
binding = "RATE_LIMITER"
id = "rate-limiter-prod"

# Default vars (used in development)
[vars]
JWT_SECRET = "test-jwt-secret-for-development-only"
OAUTH_GITHUB_CLIENT_ID = "YOUR_GITHUB_CLIENT_ID"
OAUTH_GITHUB_CLIENT_SECRET = "YOUR_GITHUB_CLIENT_SECRET"
OAUTH_GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID"
OAUTH_GOOGLE_CLIENT_SECRET = "YOUR_GOOGLE_CLIENT_SECRET"