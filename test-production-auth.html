<!DOCTYPE html>
<html>
<head>
    <title>Test Production Auth</title>
</head>
<body>
    <h1>Test Production Authentication</h1>
    
    <h2>Register</h2>
    <form id="registerForm">
        <input type="email" id="registerEmail" placeholder="Email" value="test@example.com">
        <input type="password" id="registerPassword" placeholder="Password" value="TestPass123!">
        <input type="text" id="registerUsername" placeholder="Username" value="testuser">
        <button type="submit">Register</button>
    </form>
    <pre id="registerResult"></pre>
    
    <h2>Login</h2>
    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" value="test@example.com">
        <input type="password" id="loginPassword" placeholder="Password" value="TestPass123!">
        <button type="submit">Login</button>
    </form>
    <pre id="loginResult"></pre>
    
    <script>
        const API_URL = 'https://personal-hub-backend-prod.zametech.workers.dev';
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const timestamp = Date.now();
            try {
                const response = await fetch(`${API_URL}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: `test${timestamp}@example.com`,
                        password: document.getElementById('registerPassword').value,
                        username: `testuser${timestamp}`
                    })
                });
                
                const data = await response.text();
                let parsed;
                try {
                    parsed = JSON.parse(data);
                } catch {
                    parsed = data;
                }
                
                document.getElementById('registerResult').textContent = 
                    `Status: ${response.status}\n` +
                    `Response: ${JSON.stringify(parsed, null, 2)}`;
            } catch (error) {
                document.getElementById('registerResult').textContent = 
                    `Error: ${error.message}`;
            }
        });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                
                const data = await response.text();
                let parsed;
                try {
                    parsed = JSON.parse(data);
                } catch {
                    parsed = data;
                }
                
                document.getElementById('loginResult').textContent = 
                    `Status: ${response.status}\n` +
                    `Response: ${JSON.stringify(parsed, null, 2)}`;
            } catch (error) {
                document.getElementById('loginResult').textContent = 
                    `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
