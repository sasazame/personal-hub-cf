name: Test E2E Simple

on:
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm playwright install chromium --with-deps

      - name: Build frontend
        run: |
          cd apps/frontend
          VITE_API_BASE_URL=http://localhost:8788 pnpm build

      - name: Setup backend
        run: |
          cd apps/backend
          # Initialize database
          pnpm wrangler d1 migrations apply personal-hub-local --local || true
          # Start backend
          pnpm wrangler dev --local --port 8788 &
          # Wait for backend
          sleep 10
          curl http://localhost:8788/health || exit 1

      - name: Run single test
        run: |
          cd apps/frontend
          pnpm vite preview --port 5173 &
          sleep 5
          cd ../..
          SKIP_WEBSERVER=1 E2E_BASE_URL=http://localhost:5173 VITE_API_BASE_URL=http://localhost:8788 pnpm playwright test e2e/00-setup.spec.ts e2e/ci.spec.ts --config=playwright.ci.config.ts