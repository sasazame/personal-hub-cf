name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @personal-hub/backend test

      - name: Run database migrations
        id: migrations
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd apps/backend
          
          # Show wrangler version for debugging
          echo "Wrangler version:"
          npx wrangler --version
          
          # Check migration status with proper error handling
          echo "Checking migration status..."
          if ! npx wrangler d1 migrations list DB --env production --remote 2>list.err; then
            echo "Failed to list migrations. Error output:"
            cat list.err
            # Check if it's an auth/binding error (non-zero exit usually indicates this)
            if grep -Eqi "authentication|unauthorized|binding|not found" list.err; then
              echo "Authentication or binding error detected. Please check:"
              echo "  - CLOUDFLARE_API_TOKEN is valid"
              echo "  - Database binding 'DB' exists in wrangler.toml"
              echo "  - Environment 'production' is configured"
              exit 1
            fi
            # For other errors, we might want to continue
            echo "Warning: Could not list migrations, but continuing..."
          fi
          
          # Apply migrations
          echo "Applying migrations..."
          npx wrangler d1 migrations apply DB --env production --remote
          echo "Migrations applied successfully"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        timeout-minutes: 10
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/backend
          command: deploy --env production
      - name: Verify deployment
        run: |
          set -euo pipefail
          base="https://personal-hub-backend-prod.zametech.workers.dev"

          # Retry health check up to ~30s
          for i in {1..6}; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$base/health" || echo "000")
            body=$(curl -sS --max-time 10 "$base/health" 2>/dev/null || echo "{}")
            echo "Attempt $i: /health code=$code"
            if [[ "$code" == "200" && "$body" == *"\"status\":\"ok\""* ]]; then
              echo "Health check response: $body"
              break
            fi
            if [[ $i -lt 6 ]]; then
              sleep 5
            fi
          done

          if [[ "$code" != "200" || "$body" != *"\"status\":\"ok\""* ]]; then
            echo "Health check failed after retries"
            exit 1
          fi

          # Verify feature-preferences endpoint is reachable and locked down for anon
          echo "Testing feature-preferences endpoint..."
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$base/api/v1/users/feature-preferences")
          if [[ "$code" != "401" ]]; then
            echo "Feature preferences endpoint test failed (expected 401 for unauthenticated request, got $code)"
            exit 1
          fi

          echo "Deployment verified successfully!"

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @personal-hub/frontend build
        env:
          VITE_API_BASE_URL: https://personal-hub-backend-prod.zametech.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: personal-hub
          directory: apps/frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main