name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm test -- --coverage

      - name: Run integration tests
        run: pnpm --filter @personal-hub/backend test:integration

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify build output
        run: |
          # Check that TypeScript compilation succeeded
          test -d apps/backend/dist || (echo "Backend build failed" && exit 1)
          test -d apps/frontend/dist || (echo "Frontend build failed" && exit 1)

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Build frontend
        run: |
          cd apps/frontend
          VITE_API_BASE_URL=http://localhost:8787 pnpm build

      - name: Start backend server
        run: |
          cd apps/backend
          pnpm wrangler dev --local --test-scheduled --port 8787 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          sleep 10
          curl -f http://localhost:8787/health || exit 1

      - name: Run E2E tests
        run: |
          cd apps/frontend
          # Start preview server and capture the actual port
          pnpm vite preview --port 5173 > /tmp/vite.log 2>&1 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
          cd ../..
          sleep 5
          # Extract the actual port from vite output
          ACTUAL_PORT=$(grep -oP 'localhost:\K\d+' /tmp/vite.log | head -1)
          echo "Frontend running on port: $ACTUAL_PORT"
          SKIP_WEBSERVER=1 E2E_BASE_URL=http://localhost:$ACTUAL_PORT pnpm playwright test --config=playwright.ci.config.ts --reporter=html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "$BACKEND_PID" ]; then kill $BACKEND_PID || true; fi
          if [ ! -z "$FRONTEND_PID" ]; then kill $FRONTEND_PID || true; fi