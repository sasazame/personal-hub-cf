<!DOCTYPE html>
<html>
<head>
    <title>Test Notes API</title>
</head>
<body>
    <h1>Test Notes API</h1>
    
    <h2>Login First</h2>
    <button id="loginBtn">Login</button>
    <pre id="loginResult"></pre>
    
    <h2>Get Notes</h2>
    <button id="getNotesBtn">Get Notes</button>
    <pre id="notesResult"></pre>
    
    <h2>Create Note</h2>
    <button id="createNoteBtn">Create Note</button>
    <pre id="createResult"></pre>
    
    <script>
        const API_URL = 'http://localhost:8787';
        let accessToken = '';
        
        document.getElementById('loginBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                if (data.data && data.data.accessToken) {
                    accessToken = data.data.accessToken;
                    localStorage.setItem('accessToken', accessToken);
                    document.getElementById('loginResult').textContent = 'Login successful!';
                } else {
                    document.getElementById('loginResult').textContent = 'Login failed: ' + JSON.stringify(data);
                }
            } catch (error) {
                document.getElementById('loginResult').textContent = 'Error: ' + error.message;
            }
        });
        
        document.getElementById('getNotesBtn').addEventListener('click', async () => {
            try {
                const token = accessToken || localStorage.getItem('accessToken');
                const response = await fetch(`${API_URL}/api/v1/notes`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                document.getElementById('notesResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('notesResult').textContent = 'Error: ' + error.message;
            }
        });
        
        document.getElementById('createNoteBtn').addEventListener('click', async () => {
            try {
                const token = accessToken || localStorage.getItem('accessToken');
                const response = await fetch(`${API_URL}/api/v1/notes`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: 'Test Note ' + new Date().toISOString(),
                        content: 'This is a test note created via the API',
                        tags: ['test', 'api']
                    })
                });
                
                const data = await response.json();
                document.getElementById('createResult').textContent = JSON.stringify(data, null, 2);
                
                // Refresh notes list
                document.getElementById('getNotesBtn').click();
            } catch (error) {
                document.getElementById('createResult').textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
